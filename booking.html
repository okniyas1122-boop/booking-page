<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book an Event</title>
<style>
  :root{
    --bg:#faf7f5;
    --surface:#ffffff;
    --text:#2b2320;
    --muted:#8a7d76;
    --accent:#b5543a;
    --accent-text:#ffffff;
    --border:#e7dfda;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1715;
      --surface:#262220;
      --text:#f3ece8;
      --muted:#a99c94;
      --accent:#e07a56;
      --accent-text:#1b1715;
      --border:#3a332f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1715;
    --surface:#262220;
    --text:#f3ece8;
    --muted:#a99c94;
    --accent:#e07a56;
    --accent-text:#1b1715;
    --border:#3a332f;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 40px;
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:0.92rem;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    margin:16px 0 6px;
  }
  input, textarea, select{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:1rem;
    font-family:inherit;
  }
  textarea{
    min-height:80px;
    resize:vertical;
  }
  .row{
    display:flex;
    gap:12px;
  }
  .row > div{flex:1;}
  button{
    margin-top:26px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:var(--accent-text);
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
  }
  button:active{opacity:0.85;}
  .note{
    margin-top:14px;
    font-size:0.8rem;
    color:var(--muted);
    text-align:center;
  }
  .err{
    color:var(--accent);
    font-size:0.8rem;
    margin-top:4px;
    display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Book your event</h1>
  <p class="sub">Fill in the details below — we'll get your request right away.</p>

  <form id="bookingForm">
    <label for="name">Your name</label>
    <input type="text" id="name" required placeholder="Full name">

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" required placeholder="Your contact number">

    <label for="eventType">Event type</label>
    <select id="eventType">
      <option value="Wedding">Wedding</option>
      <option value="Engagement">Engagement</option>
      <option value="Mehndi night">Mehndi night</option>
      <option value="Cradle ceremony">Cradle ceremony</option>
      <option value="Reel / shoot">Reel / shoot</option>
      <option value="Other">Other</option>
    </select>

    <div class="row">
      <div>
        <label for="startDate">Start date</label>
        <input type="date" id="startDate" required>
      </div>
      <div>
        <label for="endDate">End date (if multi-day)</label>
        <input type="date" id="endDate">
      </div>
    </div>

    <label for="location">Location</label>
    <input type="text" id="location" placeholder="Venue / city">

    <label for="notes">Anything else we should know?</label>
    <textarea id="notes" placeholder="Package, number of guests, special requests..."></textarea>
    <div class="err" id="formErr">Please fill in your name, phone and start date.</div>

    <button type="submit">Send booking request</button>
  </form>

  <p class="note">This sends your details straight to our WhatsApp.</p>
</div>

<script>
  const WHATSAPP_NUMBER = "919847516285";

  document.getElementById('bookingForm').addEventListener('submit', function(e){
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const eventType = document.getElementById('eventType').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const location = document.getElementById('location').value.trim();
    const notes = document.getElementById('notes').value.trim();
    const err = document.getElementById('formErr');

    if(!name || !phone || !startDate){
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';

    let dateText = startDate;
    if(endDate && endDate !== startDate){
      dateText = startDate + " to " + endDate;
    }

    let message = "New booking request:\n";
    message += "Name: " + name + "\n";
    message += "Phone: " + phone + "\n";
    message += "Event: " + eventType + "\n";
    message += "Date(s): " + dateText + "\n";
    if(location) message += "Location: " + location + "\n";
    if(notes) message += "Notes: " + notes + "\n";

    const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
    window.location.href = url;
  });
</script>
</body>
</html>
